<div class="row">
  <!-- Summary Cards -->
  <div class="col-md-4">
    <div class="card">
      <div class="card-body text-center">
        <h5 class="card-title">Orders</h5>
        <h2>{{ ordersCount }}</h2>
        <p>Total Orders</p>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-body text-center">
        <h5 class="card-title">Active Trucks</h5>
        <h2>{{ activeTrucks }}</h2>
        <p>Currently Active</p>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-body text-center">
        <h5 class="card-title">Expenses</h5>
        <h2>{{ totalExpenses | currency }}</h2>
        <p>This Month</p>
      </div>
    </div>
  </div>
</div>

<!-- Charts Section -->
<div class="row mt-4">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Orders Trend</h5>
        <apx-chart
          [series]="ordersChart.series"
          [chart]="ordersChart.chart"
          [xaxis]="ordersChart.xaxis"
          [title]="ordersChart.title"
        ></apx-chart>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Expenses Breakdown</h5>
        <apx-chart
          [series]="expensesChart.series"
          [chart]="expensesChart.chart"
          [labels]="expensesChart.labels"
          [title]="expensesChart.title"
        ></apx-chart>
      </div>
    </div>
  </div>
</div>
