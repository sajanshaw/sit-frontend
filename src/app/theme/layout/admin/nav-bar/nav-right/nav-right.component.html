<div class="ms-auto">
  <ul class="list-unstyled">
    <li>
      <div class="dropdown pc-h-item header-user-profile relative" ngbDropdown>
        <a
          class="pc-head-link head-link-secondary dropdown-toggle arrow-none me-0 flex items-center gap-2"
          data-bs-toggle="dropdown"
          href="javascript:"
          ngbDropdownToggle
        >
          <img src="assets/images/user/avatar-2.jpg" alt="user-image" class="user-avtar rounded-full w-8 h-8" />
          <span>
            <i class="ti ti-settings text-xl"></i>
          </span>
        </a>
        <div
          class="dropdown-menu dropdown-user-profile dropdown-menu-end pc-h-dropdown w-48 sm:w-56 md:w-64 lg:w-72 absolute right-0 mt-2 rounded-xl shadow-lg bg-white ring-1 ring-gray-200 z-50"
          ngbDropdownMenu
        >
          <div class="py-2">
            <a
              [routerLink]="['/guest/register']"
              class="flex items-center gap-3 px-4 py-2 hover:bg-violet-100 text-sm text-gray-700 transition-colors"
            >
              <i class="ti ti-settings text-purple-500"></i>
              <span>Account Profile</span>
            </a>
            <a
              [routerLink]="['/guest/login']"
              class="flex items-center gap-3 px-4 py-2 hover:bg-gray-100 text-sm text-gray-700 transition-colors"
            >
              <i class="ti ti-logout text-gray-500"></i>
              <span>Logout</span>
            </a>
          </div>
        </div>
      </div>
    </li>
  </ul>
</div>
